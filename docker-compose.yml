# docker-compose.yml — one-command self-hosting for brega.
#
# Quick start:
#   cp .env.example .env      # then edit .env
#   docker compose up -d      # builds + starts brega-server and the web console
#   open http://localhost:8080   # run the first-run setup wizard
#
# Add TLS (Let's Encrypt via Caddy) once DNS points at this host:
#   docker compose --profile tls up -d   # serves https://${BREGA_DOMAIN}
#
# brega-server is AGPL-3.0 (source: https://github.com/kafkade/brega); the web
# console is Apache-2.0 and talks to the server only over HTTP. See
# docs/self-hosting.md and ADR-006.

services:
  # Encrypted blob store + account/auth API. Never sees plaintext user data.
  brega-server:
    image: ${BREGA_SERVER_IMAGE:-ghcr.io/kafkade/brega-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - BREGA_BIND=0.0.0.0:8080
      - BREGA_DATA_DIR=/var/lib/brega-server
      - BREGA_MODE=${BREGA_MODE:-self-hosted}
      - BREGA_REGISTRATION_POLICY=${BREGA_REGISTRATION_POLICY:-disabled}
      - BREGA_ADMIN_USERNAME=${BREGA_ADMIN_USERNAME:-}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - brega-data:/var/lib/brega-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Web console + first-run wizard. Serves the SPA and proxies the API to
  # brega-server, so this is the single plain-HTTP entrypoint.
  brega-web:
    image: ${BREGA_WEB_IMAGE:-ghcr.io/kafkade/brega-web:latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${BREGA_HTTP_PORT:-8080}:80"
    depends_on:
      brega-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional TLS terminator (auto Let's Encrypt). Enable with `--profile tls`.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    depends_on:
      - brega-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BREGA_DOMAIN=${BREGA_DOMAIN:?set BREGA_DOMAIN in .env}
      - BREGA_ACME_EMAIL=${BREGA_ACME_EMAIL:?set BREGA_ACME_EMAIL in .env}
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  brega-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
